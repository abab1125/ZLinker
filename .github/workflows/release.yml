name: Release (fork)

on:
  push:
    branches: ['relaxed-stall-timings']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK (signed)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/zlinker-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=zlinker-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build APK (github channel)
        run: flutter build apk --release --dart-define=APP_CHANNEL=github

      - name: Rename artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             zlinker-${{ github.ref_name }}-${{ github.sha }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signed
          path: zlinker-${{ github.ref_name }}-${{ github.sha }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-${{ github.run_number }}
          name: ZLinker fork build #${{ github.run_number }}
          files: zlinker-${{ github.ref_name }}-${{ github.sha }}.apk
          prerelease: true
          body: |
            Fork build from `${{ github.ref_name }}` @ ${{ github.sha }}

            - Relaxed stall-defense timings (healthyWait 45s / rpc 60s / listReady 45s)
            - Signed with the fork's own keystore — install once, then upgrade in place
